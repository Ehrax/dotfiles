# =============================================================================
# Tmux Configuration
# =============================================================================

# ---------------------------------------------------------------------------
# General Settings
# ---------------------------------------------------------------------------

# Use Ctrl+Space as prefix (vim-friendly, no conflicts)
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Start windows and panes at 1 (not 0)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Enable mouse support
set -g mouse on

# Zero escape time for vim responsiveness
set -sg escape-time 0

# Increase scrollback buffer
set -g history-limit 50000

# Focus events for vim autoread
set -g focus-events on

# ---------------------------------------------------------------------------
# True Color Support
# ---------------------------------------------------------------------------

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Undercurl support (for nvim diagnostics)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# ---------------------------------------------------------------------------
# Key Bindings
# ---------------------------------------------------------------------------

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Split panes with | and - (intuitive)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Kill pane without confirmation
bind x kill-pane

# Quick session switching
bind s choose-tree -sZ

# Vi mode for copy
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# ---------------------------------------------------------------------------
# Seamless Vim-Tmux Navigation (Ctrl+h/j/k/l)
# ---------------------------------------------------------------------------

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\' 'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\' 'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# ---------------------------------------------------------------------------
# One Dark Minimal Theme (inspired by binoymanoj/dotfiles)
# ---------------------------------------------------------------------------

# Color reference:
# bg: #21252b | fg: #abb2bf | gutter: #3e4451
# black: #545862 | blue: #61afef | green: #98c379

# Status bar
set -g status on
set -g status-position bottom
set -g status-style "bg=#21252b,fg=#abb2bf"
set -g status-left-length 30
set -g status-right-length 100
set -g status-justify left

# Left: session name
set -g status-left "#[fg=#61afef,bold]  #S #[fg=#3e4451,nobold]│"

# Right: directory + git info (starship-inspired)
set -g status-right "#[fg=#56b6c2] #{b:pane_current_path} #[fg=#545862]on#(gitmux -cfg ~/.config/tmux/gitmux.conf '#{pane_current_path}')"

# Window list
set -g window-status-separator ""
setw -g window-status-format " #[fg=#545862]#I:#W "
setw -g window-status-current-format " #[fg=#61afef,bold]#I:#W "

# Pane borders
set -g pane-border-style "fg=#3e4451"
set -g pane-active-border-style "fg=#61afef"
set -g pane-border-status top
set -g pane-border-format " #[fg=#61afef,bold]#{pane_title}#[default] "

# Allow apps (e.g. Claude Code) to set pane titles via OSC escape sequences
set -g allow-passthrough on

# Messages and copy mode
set -g message-style "bg=#21252b,fg=#abb2bf,bold"
set -g message-command-style "bg=#21252b,fg=#abb2bf,bold"
setw -g mode-style "bg=#61afef,fg=#21252b"
setw -g clock-mode-colour "#61afef"

# ---------------------------------------------------------------------------
# Plugins (via TPM)
# ---------------------------------------------------------------------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Resurrect settings
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# Continuum settings (auto-save every 15 minutes, auto-restore)
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# ---------------------------------------------------------------------------
# Initialize TPM (keep at very bottom)
# ---------------------------------------------------------------------------

run '~/.config/tmux/plugins/tpm/tpm'
